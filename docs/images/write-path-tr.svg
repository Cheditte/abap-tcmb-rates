<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" role="img" aria-labelledby="title desc"><title id="title">OB08’e kayıt yolu</title><desc id="desc">Hedef: eksik kur eklemek veya farklı kuru güncellemek.</desc><rect width="800" height="840" rx="16" fill="#F5F8FB"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H784Q800 0 800 16V142H0V16Q0 0 16 0" fill="#17364A"/><text x="32" y="54" font-size="32" fill="#FFFFFF" font-weight="700"><tspan x="32" dy="0">OB08’e kayıt yolu</tspan></text><text x="32" y="98" font-size="22" fill="#D8E8F2" font-weight="400"><tspan x="32" dy="0">Hedef: eksik kur eklemek veya farklı kuru güncellemek.</tspan></text><rect x="24" y="168" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="168" width="7" height="130" fill="#94551A"/><text x="50" y="204" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">1 · Etkiyi seçin ve ön izleyin</tspan></text><text x="50" y="243" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Olduğu gibi bırak: eksikleri ekle, farklı kaydı koru</tspan></text><text x="50" y="276" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Güncelle: eksikleri ekle, farklı kaydı değiştir.</tspan></text><rect x="24" y="316" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="316" width="7" height="130" fill="#94551A"/><text x="50" y="352" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">2 · OB08 bakımından çıkın</tspan></text><text x="50" y="391" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Kontrol bitti → açık bakım işlemlerini kapatın</tspan></text><text x="50" y="424" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Başka pencereye geçmek kilidi kaldırmaz.</tspan></text><rect x="24" y="464" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="464" width="7" height="130" fill="#94551A"/><text x="50" y="500" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">3 · Gerçek çalıştırmayı başlatın</tspan></text><text x="50" y="539" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Deneme işaretini kaldır → F8</tspan></text><text x="50" y="572" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Ayrı bir Kaydet veya onay adımı yoktur.</tspan></text><rect x="24" y="612" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="612" width="7" height="130" fill="#94551A"/><text x="50" y="648" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">4 · OB08’de doğrulayın</tspan></text><text x="50" y="687" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Aynı kur tipi + para çifti + geçerlilik tarihi</tspan></text><text x="50" y="720" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Kısmi hata varsa başarılı kayıtlar geri alınmaz.</tspan></text><text x="32" y="814" font-size="20" fill="#17364A" font-weight="600"><tspan x="32" dy="0">Kontrolden sonra OB08 bakım ekranından tekrar çıkın.</tspan></text></g></svg>
