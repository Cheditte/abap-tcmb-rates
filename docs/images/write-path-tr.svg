<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc"><title id="title">OB08’e kayıt yolu</title><desc id="desc">Hedef: eksik kur eklemek veya farklı kuru güncellemek.</desc><rect width="1000" height="840" rx="16" fill="#231A28"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H984Q1000 0 1000 16V142H0V16Q0 0 16 0" fill="#302638"/><text x="32" y="54" font-size="32" fill="#F4F0E8" font-weight="700"><tspan x="32" dy="0">OB08’e kayıt yolu</tspan></text><text x="32" y="98" font-size="22" fill="#BDB4C2" font-weight="400"><tspan x="32" dy="0">Hedef: eksik kur eklemek veya farklı kuru güncellemek.</tspan></text><rect x="24" y="168" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="168" width="7" height="130" fill="#D4E86A"/><text x="50" y="204" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">1 · Etkiyi seçin ve ön izleyin</tspan></text><text x="50" y="243" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Olduğu gibi bırak: eksikleri ekle, farklı kaydı koru</tspan></text><text x="50" y="276" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Güncelle: eksikleri ekle, farklı kaydı değiştir.</tspan></text><rect x="24" y="316" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="316" width="7" height="130" fill="#D4E86A"/><text x="50" y="352" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">2 · OB08 bakımından çıkın</tspan></text><text x="50" y="391" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Kontrol bitti → açık bakım işlemlerini kapatın</tspan></text><text x="50" y="424" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Başka pencereye geçmek kilidi kaldırmaz.</tspan></text><rect x="24" y="464" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="464" width="7" height="130" fill="#D4E86A"/><text x="50" y="500" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">3 · Gerçek çalıştırmayı başlatın</tspan></text><text x="50" y="539" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Deneme işaretini kaldır → F8</tspan></text><text x="50" y="572" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Ayrı bir Kaydet veya onay adımı yoktur.</tspan></text><rect x="24" y="612" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="612" width="7" height="130" fill="#D4E86A"/><text x="50" y="648" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">4 · OB08’de doğrulayın</tspan></text><text x="50" y="687" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Aynı kur tipi + para çifti + geçerlilik tarihi</tspan></text><text x="50" y="720" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Kısmi hata varsa başarılı kayıtlar geri alınmaz.</tspan></text><text x="32" y="814" font-size="20" fill="#F4F0E8" font-weight="600"><tspan x="32" dy="0">Kontrolden sonra OB08 bakım ekranından tekrar çıkın.</tspan></text></g><g transform="translate(866 190) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M16 9 49 3 59 13V56L21 64 11 56V15Z" fill="#302638"/><path d="M11 15 44 8 54 18V59L11 67Z" fill="#F4F0E8"/><path d="m44 8 0 12 10-2" fill="#D4E86A"/><path d="m20 32 25-5m-25 15 25-5m-25 15 18-4" stroke="#88798E" stroke-width="3"/><path d="m17 21 12-3" stroke="#231A28" stroke-width="3"/></g><g transform="translate(866 338) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="m5 21 18-9 16 8-18 9Z" fill="#BDB4C2"/><path d="m5 21 16 8v25L5 46Z" fill="#F4F0E8"/><path d="m21 29 18-9v25l-18 9Z" fill="#302638"/><path d="M28 39h13V25h11" stroke="#D4E86A" stroke-width="4" fill="none"/><path d="m48 14 14-7 10 6-14 7Z" fill="#BDB4C2"/><path d="m48 14 10 6v24l-10-6Z" fill="#F4F0E8"/><path d="m58 20 14-7v24l-14 7Z" fill="#302638"/></g><g transform="translate(866 486) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M5 15 49 5 64 14 20 24Z" fill="#BDB4C2"/><path d="M20 24 64 14V50L20 60Z" fill="#302638"/><path d="M5 15 49 5V41L5 51Z" fill="#F4F0E8"/><path d="M11 21 43 14V35L11 43Z" fill="#231A28"/><path d="m18 27 6 3-6 5m12-1 8-2" fill="none" stroke="#D4E86A"/><path d="M23 48v12l-8 4 22-5-8-2V46" fill="#BDB4C2"/></g><g transform="translate(866 634) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="m11 13 40-8 13 10v42l-40 8-13-10Z" fill="#302638"/><path d="m11 13 40-8v42l-40 8Z" fill="#F4F0E8"/><path d="m19 31 9 7 16-19" fill="none" stroke="#687832" stroke-width="5"/></g></svg>
