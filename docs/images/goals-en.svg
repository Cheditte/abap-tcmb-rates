<svg xmlns="http://www.w3.org/2000/svg" width="800" height="692" viewBox="0 0 800 692" role="img" aria-labelledby="title desc"><title id="title">Start with your goal</title><desc id="desc">One report. Three paths to the result you need.</desc><rect width="800" height="692" rx="16" fill="#F5F8FB"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H784Q800 0 800 16V142H0V16Q0 0 16 0" fill="#17364A"/><text x="32" y="54" font-size="32" fill="#FFFFFF" font-weight="700"><tspan x="32" dy="0">Start with your goal</tspan></text><text x="32" y="98" font-size="22" fill="#D8E8F2" font-weight="400"><tspan x="32" dy="0">One report. Three paths to the result you need.</tspan></text><rect x="24" y="168" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="168" width="7" height="130" fill="#146788"/><text x="50" y="204" font-size="26" fill="#146788" font-weight="700"><tspan x="50" dy="0">A · Preview without saving</tspan></text><text x="50" y="243" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Choose date and currencies → Test selected → F8</tspan></text><text x="50" y="276" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Outcome: inspect data and planned operations.</tspan></text><rect x="24" y="316" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="316" width="7" height="130" fill="#94551A"/><text x="50" y="352" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">B · Prepare OB08 records</tspan></text><text x="50" y="391" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Preview → choose Keep or Update → execute write</tspan></text><text x="50" y="424" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Outcome: verify the same key and date in OB08.</tspan></text><rect x="24" y="464" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="464" width="7" height="130" fill="#6552A1"/><text x="50" y="500" font-size="26" fill="#6552A1" font-weight="700"><tspan x="50" dy="0">C · Run automatically each day</tspan></text><text x="50" y="539" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Save variant → dynamic date → SM36 job</tspan></text><text x="50" y="572" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Outcome: monitor execution in SM37 and OB08.</tspan></text><text x="32" y="666" font-size="20" fill="#17364A" font-weight="600"><tspan x="32" dy="0">First use: install in SE38 and start in a sandbox.</tspan></text></g></svg>
