<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="692" viewBox="0 0 1000 692" role="img" aria-labelledby="title desc"><title id="title">Hedefinizden başlayın</title><desc id="desc">Bir program. Yapmak istediğiniz işe göre üç yol.</desc><rect width="1000" height="692" rx="16" fill="#231A28"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H984Q1000 0 1000 16V142H0V16Q0 0 16 0" fill="#302638"/><text x="32" y="54" font-size="32" fill="#F4F0E8" font-weight="700"><tspan x="32" dy="0">Hedefinizden başlayın</tspan></text><text x="32" y="98" font-size="22" fill="#BDB4C2" font-weight="400"><tspan x="32" dy="0">Bir program. Yapmak istediğiniz işe göre üç yol.</tspan></text><rect x="24" y="168" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="168" width="7" height="130" fill="#D4E86A"/><text x="50" y="204" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">A · Kaydetmeden denemek</tspan></text><text x="50" y="243" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Tarih ve döviz seç → Deneme işaretli → F8</tspan></text><text x="50" y="276" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Sonuç: veriyi ve planlanan işlemi görün.</tspan></text><rect x="24" y="316" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="316" width="7" height="130" fill="#D4E86A"/><text x="50" y="352" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">B · OB08 kayıtlarını hazırlamak</tspan></text><text x="50" y="391" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Ön izle → ekle / güncelle seç → gerçek çalıştır</tspan></text><text x="50" y="424" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Sonuç: kaydı OB08’de aynı anahtar ve tarihle doğrulayın.</tspan></text><rect x="24" y="464" width="952" height="130" rx="8" fill="#302638"/><rect x="24" y="464" width="7" height="130" fill="#D4E86A"/><text x="50" y="500" font-size="26" fill="#D4E86A" font-weight="700"><tspan x="50" dy="0">C · Her gün otomatik çalıştırmak</tspan></text><text x="50" y="539" font-size="22" fill="#F4F0E8" font-weight="400"><tspan x="50" dy="0">Varyantı kaydet → dinamik tarih → SM36 işi</tspan></text><text x="50" y="572" font-size="21" fill="#BDB4C2" font-weight="400"><tspan x="50" dy="0">Sonuç: günlük çalışmayı SM37 ve OB08’den izleyin.</tspan></text><text x="32" y="666" font-size="20" fill="#F4F0E8" font-weight="600"><tspan x="32" dy="0">İlk kullanım: SE38 kurulumu ve deneme sistemi.</tspan></text></g><g transform="translate(866 190) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M5 15 49 5 64 14 20 24Z" fill="#BDB4C2"/><path d="M20 24 64 14V50L20 60Z" fill="#302638"/><path d="M5 15 49 5V41L5 51Z" fill="#F4F0E8"/><path d="M11 21 43 14V35L11 43Z" fill="#231A28"/><path d="m18 27 6 3-6 5m12-1 8-2" fill="none" stroke="#D4E86A"/><path d="M23 48v12l-8 4 22-5-8-2V46" fill="#BDB4C2"/></g><g transform="translate(866 338) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M16 9 49 3 59 13V56L21 64 11 56V15Z" fill="#302638"/><path d="M11 15 44 8 54 18V59L11 67Z" fill="#F4F0E8"/><path d="m44 8 0 12 10-2" fill="#D4E86A"/><path d="m20 32 25-5m-25 15 25-5m-25 15 18-4" stroke="#88798E" stroke-width="3"/><path d="m17 21 12-3" stroke="#231A28" stroke-width="3"/></g><g transform="translate(866 486) scale(1.1)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M40 6C62 7 68 24 62 45S39 67 24 57L17 49Z" fill="#302638"/><ellipse cx="31" cy="33" rx="25" ry="28" fill="#F4F0E8"/><path d="M31 15v20l14 4" fill="none" stroke="#231A28" stroke-width="4"/><path d="M31 7v5m0 42v5M8 33h5m36 0h5" stroke="#88798E"/></g></svg>
