<svg xmlns="http://www.w3.org/2000/svg" width="800" height="692" viewBox="0 0 800 692" role="img" aria-labelledby="title desc"><title id="title">Hedefinizden başlayın</title><desc id="desc">Bir program. Yapmak istediğiniz işe göre üç yol.</desc><rect width="800" height="692" rx="16" fill="#F5F8FB"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H784Q800 0 800 16V142H0V16Q0 0 16 0" fill="#17364A"/><text x="32" y="54" font-size="32" fill="#FFFFFF" font-weight="700"><tspan x="32" dy="0">Hedefinizden başlayın</tspan></text><text x="32" y="98" font-size="22" fill="#D8E8F2" font-weight="400"><tspan x="32" dy="0">Bir program. Yapmak istediğiniz işe göre üç yol.</tspan></text><rect x="24" y="168" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="168" width="7" height="130" fill="#146788"/><text x="50" y="204" font-size="26" fill="#146788" font-weight="700"><tspan x="50" dy="0">A · Kaydetmeden denemek</tspan></text><text x="50" y="243" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Tarih ve döviz seç → Deneme işaretli → F8</tspan></text><text x="50" y="276" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Sonuç: veriyi ve planlanan işlemi görün.</tspan></text><rect x="24" y="316" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="316" width="7" height="130" fill="#94551A"/><text x="50" y="352" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">B · OB08 kayıtlarını hazırlamak</tspan></text><text x="50" y="391" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Ön izle → ekle / güncelle seç → gerçek çalıştır</tspan></text><text x="50" y="424" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Sonuç: kaydı OB08’de aynı anahtar ve tarihle doğrulayın.</tspan></text><rect x="24" y="464" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="464" width="7" height="130" fill="#6552A1"/><text x="50" y="500" font-size="26" fill="#6552A1" font-weight="700"><tspan x="50" dy="0">C · Her gün otomatik çalıştırmak</tspan></text><text x="50" y="539" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Varyantı kaydet → dinamik tarih → SM36 işi</tspan></text><text x="50" y="572" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Sonuç: günlük çalışmayı SM37 ve OB08’den izleyin.</tspan></text><text x="32" y="666" font-size="20" fill="#17364A" font-weight="600"><tspan x="32" dy="0">İlk kullanım: SE38 kurulumu ve deneme sistemi.</tspan></text></g></svg>
