<svg xmlns="http://www.w3.org/2000/svg" width="800" height="692" viewBox="0 0 800 692" role="img" aria-labelledby="title desc"><title id="title">Preview path</title><desc id="desc">Goal: inspect data without saving standard rates.</desc><rect width="800" height="692" rx="16" fill="#F5F8FB"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H784Q800 0 800 16V142H0V16Q0 0 16 0" fill="#17364A"/><text x="32" y="54" font-size="32" fill="#FFFFFF" font-weight="700"><tspan x="32" dy="0">Preview path</tspan></text><text x="32" y="98" font-size="22" fill="#D8E8F2" font-weight="400"><tspan x="32" dy="0">Goal: inspect data without saving standard rates.</tspan></text><rect x="24" y="168" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="168" width="7" height="130" fill="#146788"/><text x="50" y="204" font-size="26" fill="#146788" font-weight="700"><tspan x="50" dy="0">1 · Make a small selection</tspan></text><text x="50" y="243" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">One day + one currency + a suitable SAP rate type</tspan></text><text x="50" y="276" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">The connection button checks access only.</tspan></text><rect x="24" y="316" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="316" width="7" height="130" fill="#146788"/><text x="50" y="352" font-size="26" fill="#146788" font-weight="700"><tspan x="50" dy="0">2 · Keep Test run selected</tspan></text><text x="50" y="391" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">F8 → read, calculate and compare</tspan></text><text x="50" y="424" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">NEW and UPDATED are planned operations here.</tspan></text><rect x="24" y="464" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="464" width="7" height="130" fill="#146788"/><text x="50" y="500" font-size="26" fill="#146788" font-weight="700"><tspan x="50" dy="0">3 · Review the result</tspan></text><text x="50" y="539" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Date, currency pair, value, factors and message</tspan></text><text x="50" y="572" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Stop here if you only need to inspect the rates.</tspan></text><text x="32" y="666" font-size="20" fill="#17364A" font-weight="600"><tspan x="32" dy="0">Preview does not verify actual write authorization.</tspan></text></g></svg>
