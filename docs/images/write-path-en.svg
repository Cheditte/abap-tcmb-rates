<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" role="img" aria-labelledby="title desc"><title id="title">Write and verify in OB08</title><desc id="desc">Goal: add missing rates or update different values.</desc><rect width="800" height="840" rx="16" fill="#F5F8FB"/><g font-family="Segoe UI, Arial, sans-serif"><path d="M16 0H784Q800 0 800 16V142H0V16Q0 0 16 0" fill="#17364A"/><text x="32" y="54" font-size="32" fill="#FFFFFF" font-weight="700"><tspan x="32" dy="0">Write and verify in OB08</tspan></text><text x="32" y="98" font-size="22" fill="#D8E8F2" font-weight="400"><tspan x="32" dy="0">Goal: add missing rates or update different values.</tspan></text><rect x="24" y="168" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="168" width="7" height="130" fill="#94551A"/><text x="50" y="204" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">1 · Choose the effect and preview</tspan></text><text x="50" y="243" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Keep: add missing records, preserve differences</tspan></text><text x="50" y="276" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Update: add missing records, replace differences.</tspan></text><rect x="24" y="316" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="316" width="7" height="130" fill="#94551A"/><text x="50" y="352" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">2 · Exit OB08 maintenance</tspan></text><text x="50" y="391" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Inspection complete → leave maintenance sessions</tspan></text><text x="50" y="424" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Switching windows does not release the lock.</tspan></text><rect x="24" y="464" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="464" width="7" height="130" fill="#94551A"/><text x="50" y="500" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">3 · Start the actual run</tspan></text><text x="50" y="539" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Clear Test run → F8</tspan></text><text x="50" y="572" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">There is no separate Save or confirmation step.</tspan></text><rect x="24" y="612" width="752" height="130" rx="8" fill="#FFFFFF"/><rect x="24" y="612" width="7" height="130" fill="#94551A"/><text x="50" y="648" font-size="26" fill="#94551A" font-weight="700"><tspan x="50" dy="0">4 · Verify the records in OB08</tspan></text><text x="50" y="687" font-size="22" fill="#17364A" font-weight="400"><tspan x="50" dy="0">Same rate type + currency pair + valid-from date</tspan></text><text x="50" y="720" font-size="21" fill="#48606F" font-weight="400"><tspan x="50" dy="0">Partial failures do not roll back successful rows.</tspan></text><text x="32" y="814" font-size="20" fill="#17364A" font-weight="600"><tspan x="32" dy="0">Exit OB08 maintenance again after verification.</tspan></text></g></svg>
