<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Kurulum haritanız</title><desc id="desc">Bir kez hazırlayın, her çalıştırmada aynı profili kullanın.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1b30"/><stop offset="1" stop-color="#193b4b"/></linearGradient></defs><rect width="760" height="560" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="36" y="55" fill="#fff" font-weight="700" font-size="32">Kurulum haritanız</text><text x="36" y="88" fill="#c6d6e1" font-size="19">Bir kez hazırlayın, her çalıştırmada aynı profili kullanın.</text><rect x="32" y="120" width="696" height="108" rx="16" fill="#f5f9fb"/><circle cx="76" cy="163" r="23" fill="#d3f5eb"/><text x="76" y="171" text-anchor="middle" fill="#056955" font-size="25" font-weight="700">1</text><text x="116" y="161" fill="#112d41" font-size="25" font-weight="700">SAP nesnelerini kurun</text><text x="116" y="196" fill="#3a5365" font-size="19">SE38’de tek dosyalı kurulumu çalıştırın.</text><path d="M76 231v10m-4-4 4 4 4-4" stroke="#75ddc0" fill="none" stroke-width="2"/><rect x="32" y="245" width="696" height="108" rx="16" fill="#f5f9fb"/><circle cx="76" cy="288" r="23" fill="#d3f5eb"/><text x="76" y="296" text-anchor="middle" fill="#056955" font-size="25" font-weight="700">2</text><text x="116" y="286" fill="#112d41" font-size="25" font-weight="700">Profil ve erişimi hazırlayın</text><text x="116" y="321" fill="#3a5365" font-size="19">Hangi kurlar, hangi tarih? SAP bültene ulaşabiliyor mu?</text><path d="M76 356v10m-4-4 4 4 4-4" stroke="#75ddc0" fill="none" stroke-width="2"/><rect x="32" y="370" width="696" height="108" rx="16" fill="#f5f9fb"/><circle cx="76" cy="413" r="23" fill="#d3f5eb"/><text x="76" y="421" text-anchor="middle" fill="#056955" font-size="25" font-weight="700">3</text><text x="116" y="411" fill="#112d41" font-size="25" font-weight="700">Önce deneyin, sonra kaydedin</text><text x="116" y="446" fill="#3a5365" font-size="19">Tek günle başlayın; sonucu doğrulayıp OB08’i kontrol edin.</text><text x="36" y="531" fill="#b9ebdd" font-size="19">İlk kurulumu ve gerçek yazma denemesini DEV / testte yapın.</text></g></svg>
