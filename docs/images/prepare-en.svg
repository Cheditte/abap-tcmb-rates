<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 0 800 750" role="img" aria-labelledby="title desc"><title id="title">Three preparations before you start</title><desc id="desc">SAP development access, rate choices, and connectivity from the SAP application server to TCMB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#D4E86A" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="800" height="750" rx="0" fill="#231A28" stroke="none"/><g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="48" font-size="32" fill="#F4F0E8" font-weight="700" ><tspan x="32" dy="0">Three things to prepare</tspan></text><text x="32" y="84" font-size="21" fill="#BDB4C2" font-weight="400" ><tspan x="32" dy="0">These are separate tasks; one person may do all three.</tspan></text><path d="M32 108H768" stroke="#F4F0E8" stroke-width="2"/><g transform="translate(32 137) scale(0.95)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M5 15 49 5 64 14 20 24Z" fill="#BDB4C2"/><path d="M20 24 64 14V50L20 60Z" fill="#302638"/><path d="M5 15 49 5V41L5 51Z" fill="#F4F0E8"/><path d="M11 21 43 14V35L11 43Z" fill="#231A28"/><path d="m18 27 6 3-6 5m12-1 8-2" fill="none" stroke="#D4E86A"/><path d="M23 48v12l-8 4 22-5-8-2V46" fill="#BDB4C2"/></g><text x="120" y="162" font-size="26" fill="#F4F0E8" font-weight="700" ><tspan x="120" dy="0">SAP development access</tspan></text><text x="120" y="198" font-size="21" fill="#BDB4C2" font-weight="400" ><tspan x="120" dy="0">You can create and run a report in SE38.</tspan><tspan x="120" dy="29">You need a DEV system and a package choice.</tspan></text><path d="M120 253H768" stroke="#55475E" stroke-width="2"/><g transform="translate(32 278) scale(0.95)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="M16 9 49 3 59 13V56L21 64 11 56V15Z" fill="#302638"/><path d="M11 15 44 8 54 18V59L11 67Z" fill="#F4F0E8"/><path d="m44 8 0 12 10-2" fill="#D4E86A"/><path d="m20 32 25-5m-25 15 25-5m-25 15 18-4" stroke="#88798E" stroke-width="3"/><path d="m17 21 12-3" stroke="#231A28" stroke-width="3"/></g><text x="120" y="309" font-size="26" fill="#F4F0E8" font-weight="700" ><tspan x="120" dy="0">Decisions about the rates</tspan></text><text x="120" y="345" font-size="21" fill="#BDB4C2" font-weight="400" ><tspan x="120" dy="0">Choose currencies, buying/selling rates and dates.</tspan><tspan x="120" dy="29">Verify the SAP rate type and OBBS translation ratios.</tspan></text><path d="M120 400H768" stroke="#55475E" stroke-width="2"/><g transform="translate(30 433) scale(0.95)" stroke="#231A28" stroke-width="1.8" stroke-linejoin="round"><path d="m5 21 18-9 16 8-18 9Z" fill="#BDB4C2"/><path d="m5 21 16 8v25L5 46Z" fill="#F4F0E8"/><path d="m21 29 18-9v25l-18 9Z" fill="#302638"/><path d="M28 39h13V25h11" stroke="#D4E86A" stroke-width="4" fill="none"/><path d="m48 14 14-7 10 6-14 7Z" fill="#BDB4C2"/><path d="m48 14 10 6v24l-10-6Z" fill="#F4F0E8"/><path d="m58 20 14-7v24l-14 7Z" fill="#302638"/></g><text x="120" y="456" font-size="26" fill="#F4F0E8" font-weight="700" ><tspan x="120" dy="0">Connectivity from SAP to TCMB</tspan></text><text x="120" y="492" font-size="21" fill="#BDB4C2" font-weight="400" ><tspan x="120" dy="0">The SAP application server must reach TCMB via HTTPS.</tspan><tspan x="120" dy="29">Access from your own computer alone is not enough.</tspan></text><rect x="32" y="584" width="736" height="98" rx="4" fill="#302638" stroke="none"/><text x="52" y="619" font-size="22" fill="#F4F0E8" font-weight="600" ><tspan x="52" dy="0">If you have access, you can do this yourself.</tspan></text><text x="52" y="651" font-size="21" fill="#BDB4C2" font-weight="400" ><tspan x="52" dy="0">Involve the FI or Basis/network owner where needed.</tspan></text><text x="32" y="724" font-size="20" fill="#D4E86A" font-weight="600" ><tspan x="32" dy="0">The standard HTTPS route needs no extra server software.</tspan></text></g></svg>
