<svg xmlns="http://www.w3.org/2000/svg" width="800" height="818" viewBox="0 0 800 818" role="img" aria-labelledby="title desc"><title id="title">Installation and use through three SE38 reports</title><desc id="desc">Run ZCHE_TCMB_INSTALL, then ZCHE_TCMB_CONFIG; use ZCHE_TCMB_LOAD for each rate run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#126C65" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="800" height="818" rx="0" fill="#F7F8F4" stroke="none"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="122" rx="0" fill="#153446" stroke="none"/><text x="32" y="44" font-size="32" fill="#FFFFFF" font-weight="700" ><tspan x="32" dy="0">Your path through SE38</tspan></text><text x="32" y="80" font-size="21" fill="#D9E7E7" font-weight="400" ><tspan x="32" dy="0">Install and configure once; then use the load report.</tspan></text><text x="32" y="161" font-size="18" fill="#126C65" font-weight="700" ><tspan x="32" dy="0">INITIAL SETUP</tspan></text><path d="M196 155H768" stroke="#CBD8D8" stroke-width="2"/><rect x="32" y="193" width="53" height="43" rx="3" fill="#126C65" stroke="none"/><text x="58.5" y="223" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="58.5" dy="0">1</tspan></text><text x="110" y="221" font-size="26" fill="#153446" font-weight="700" ><tspan x="110" dy="0">Install</tspan></text><text x="110" y="259" font-size="25" fill="#126C65" font-weight="600" ><tspan x="110" dy="0">ZCHE_TCMB_INSTALL</tspan></text><text x="110" y="296" font-size="21" fill="#506875" font-weight="400" ><tspan x="110" dy="0">Creates the SAP objects from one source file.</tspan></text><text x="110" y="328" font-size="21" fill="#506875" font-weight="400" ><tspan x="110" dy="0">Result: settings and load reports are ready.</tspan></text><path d="M58 244L58 350m7 -11L58 350l-7 -11" fill="none" stroke="#126C65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="369" width="53" height="43" rx="3" fill="#126C65" stroke="none"/><text x="58.5" y="399" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="58.5" dy="0">2</tspan></text><text x="110" y="397" font-size="26" fill="#153446" font-weight="700" ><tspan x="110" dy="0">Save your choices</tspan></text><text x="110" y="435" font-size="25" fill="#126C65" font-weight="600" ><tspan x="110" dy="0">ZCHE_TCMB_CONFIG</tspan></text><text x="110" y="472" font-size="21" fill="#506875" font-weight="400" ><tspan x="110" dy="0">Choose currencies, rate type and date rule.</tspan></text><text x="110" y="504" font-size="21" fill="#506875" font-weight="400" ><tspan x="110" dy="0">Result: a reusable settings profile.</tspan></text><text x="32" y="548" font-size="18" fill="#126C65" font-weight="700" ><tspan x="32" dy="0">EACH RUN</tspan></text><path d="M209 542H768" stroke="#CBD8D8" stroke-width="2"/><rect x="32" y="584" width="53" height="43" rx="3" fill="#126C65" stroke="none"/><text x="58.5" y="614" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="58.5" dy="0">3</tspan></text><text x="110" y="612" font-size="26" fill="#153446" font-weight="700" ><tspan x="110" dy="0">Load the rates</tspan></text><text x="110" y="650" font-size="25" fill="#126C65" font-weight="600" ><tspan x="110" dy="0">ZCHE_TCMB_LOAD</tspan></text><text x="110" y="687" font-size="21" fill="#506875" font-weight="400" ><tspan x="110" dy="0">Choose the profile and date; preview first.</tspan></text><text x="110" y="719" font-size="21" fill="#506875" font-weight="400" ><tspan x="110" dy="0">Then choose to save and verify in OB08.</tspan></text><path d="M32 753H768" stroke="#CBD8D8" stroke-width="2"/><text x="32" y="791" font-size="21" fill="#153446" font-weight="600" ><tspan x="32" dy="0">Start in a DEV system / sandbox.</tspan></text></g></svg>
