<svg xmlns="http://www.w3.org/2000/svg" width="800" height="791" viewBox="0 0 800 791" role="img" aria-labelledby="title desc"><title id="title">From a TCMB bulletin to SAP exchange rates</title><desc id="desc">TCMB bulletin, selection screen and variant, preview and controlled OB08 write.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#126C65" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="800" height="791" rx="0" fill="#F7F8F4" stroke="none"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="800" height="104" rx="0" fill="#153446" stroke="none"/><text x="32" y="44" font-size="30" fill="#FFFFFF" font-weight="700" ><tspan x="32" dy="0">From TCMB to SAP: what happens?</tspan></text><text x="32" y="79" font-size="21" fill="#D9E7E7" font-weight="400" ><tspan x="32" dy="0">Read the bulletin → review → choose to save.</tspan></text><rect x="32" y="133" width="262" height="218" rx="4" fill="#FFFFFF" stroke="#CBD8D8"/><rect x="32" y="133" width="262" height="7" rx="0" fill="#126C65" stroke="none"/><text x="52" y="178" font-size="28" fill="#153446" font-weight="700" ><tspan x="52" dy="0">TCMB</tspan></text><text x="52" y="211" font-size="20" fill="#506875" font-weight="400" ><tspan x="52" dy="0">Daily rate bulletin</tspan></text><path d="M52 230H273" stroke="#CBD8D8" stroke-width="2"/><text x="52" y="263" font-size="23" fill="#153446" font-weight="400" ><tspan x="52" dy="0">USD → TRY</tspan></text><text x="52" y="300" font-size="23" fill="#153446" font-weight="400" ><tspan x="52" dy="0">JPY → TRY</tspan></text><text x="52" y="331" font-size="19" fill="#506875" font-weight="400" ><tspan x="52" dy="0">A published day</tspan></text><path d="M304 239L344 239m-11 -7L344 239l-11 7" fill="none" stroke="#126C65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="361" y="133" width="407" height="218" rx="4" fill="#E4F0EA" stroke="none"/><text x="383" y="178" font-size="27" fill="#153446" font-weight="700" ><tspan x="383" dy="0">Your settings in SAP</tspan></text><text x="383" y="216" font-size="20" fill="#126C65" font-weight="400" ><tspan x="383" dy="0">Variant = your saved choices</tspan></text><path d="M383 253l7 7 16-19" stroke="#126C65" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="417" y="258" font-size="21" fill="#153446" font-weight="400" ><tspan x="417" dy="0">Which currencies?</tspan></text><path d="M383 288l7 7 16-19" stroke="#126C65" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="417" y="293" font-size="21" fill="#153446" font-weight="400" ><tspan x="417" dy="0">Buying or selling?</tspan></text><path d="M383 323l7 7 16-19" stroke="#126C65" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="417" y="328" font-size="21" fill="#153446" font-weight="400" ><tspan x="417" dy="0">Valid from which date?</tspan></text><path d="M565 359L565 394m7 -11L565 394l-7 -11" fill="none" stroke="#126C65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="407" width="736" height="149" rx="4" fill="#FFFFFF" stroke="#CBD8D8"/><text x="52" y="444" font-size="25" fill="#153446" font-weight="700" ><tspan x="52" dy="0">Preview · Test run selected</tspan></text><text x="52" y="476" font-size="21" fill="#506875" font-weight="400" ><tspan x="52" dy="0">Check the rates, dates, rate type and messages.</tspan></text><rect x="52" y="495" width="696" height="41" rx="3" fill="#E4F0EA" stroke="none"/><path d="M67 514l7 7 16-19" stroke="#126C65" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="101" y="523" font-size="21" fill="#126C65" font-weight="600" ><tspan x="101" dy="0">No exchange rates are saved at this stage.</tspan></text><path d="M400 565L400 601m7 -11L400 601l-7 -11" fill="none" stroke="#126C65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="613" width="736" height="111" rx="4" fill="#153446" stroke="none"/><rect x="32" y="613" width="8" height="111" rx="0" fill="#ECC477" stroke="none"/><text x="55" y="651" font-size="25" fill="#FFFFFF" font-weight="700" ><tspan x="55" dy="0">When you decide to save</tspan></text><text x="55" y="685" font-size="21" fill="#D9E7E7" font-weight="400" ><tspan x="55" dy="0">Clear Test run → execute → verify the records in OB08.</tspan></text><text x="32" y="765" font-size="20" fill="#506875" font-weight="400" ><tspan x="32" dy="0">OB08: the SAP transaction for viewing exchange rates.</tspan></text></g></svg>
