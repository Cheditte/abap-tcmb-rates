<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Use TCMB rates in SAP</title><desc id="desc">Retrieve a bulletin, preview the results, then save to SAP.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1b30"/><stop offset="1" stop-color="#193b4b"/></linearGradient></defs><rect width="760" height="560" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="36" y="55" fill="#fff" font-weight="700" font-size="32">Use TCMB rates in SAP</text><text x="36" y="88" fill="#c6d6e1" font-size="19">Retrieve a bulletin, preview the results, then save to SAP.</text><rect x="32" y="120" width="696" height="108" rx="16" fill="#f5f9fb"/><circle cx="76" cy="163" r="23" fill="#d3f5eb"/><text x="76" y="171" text-anchor="middle" fill="#056955" font-size="25" font-weight="700">1</text><text x="116" y="161" fill="#112d41" font-size="25" font-weight="700">Retrieve the TCMB bulletin</text><text x="116" y="196" fill="#3a5365" font-size="19">Read published rates for your selected date.</text><path d="M76 231v10m-4-4 4 4 4-4" stroke="#75ddc0" fill="none" stroke-width="2"/><rect x="32" y="245" width="696" height="108" rx="16" fill="#f5f9fb"/><circle cx="76" cy="288" r="23" fill="#d3f5eb"/><text x="76" y="296" text-anchor="middle" fill="#056955" font-size="25" font-weight="700">2</text><text x="116" y="286" fill="#112d41" font-size="25" font-weight="700">Preview without saving rates</text><text x="116" y="321" fill="#3a5365" font-size="19">Check currencies, rate type and valid-from dates.</text><path d="M76 356v10m-4-4 4 4 4-4" stroke="#75ddc0" fill="none" stroke-width="2"/><rect x="32" y="370" width="696" height="108" rx="16" fill="#f5f9fb"/><circle cx="76" cy="413" r="23" fill="#d3f5eb"/><text x="76" y="421" text-anchor="middle" fill="#056955" font-size="25" font-weight="700">3</text><text x="116" y="411" fill="#112d41" font-size="25" font-weight="700">Save to SAP and verify</text><text x="116" y="446" fill="#3a5365" font-size="19">Clear Test run to save; check the records in OB08.</text><text x="36" y="531" fill="#b9ebdd" font-size="19">For daily use: schedule a SAP job after verifying the load.</text></g></svg>
