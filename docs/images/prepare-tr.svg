<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 0 800 750" role="img" aria-labelledby="title desc"><title id="title">Başlamadan önce gereken üç hazırlık</title><desc id="desc">SAP geliştirme erişimi, kullanılacak kur kararları ve SAP uygulama sunucusundan TCMB bağlantısı.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#126C65" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="800" height="750" rx="0" fill="#F7F8F4" stroke="none"/><g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="48" font-size="32" fill="#153446" font-weight="700" ><tspan x="32" dy="0">Başlamak için üç hazırlık</tspan></text><text x="32" y="84" font-size="21" fill="#506875" font-weight="400" ><tspan x="32" dy="0">Bunlar ayrı işlerdir; aynı kişi hepsini yapabilir.</tspan></text><path d="M32 108H768" stroke="#153446" stroke-width="2"/><rect x="32" y="136" width="66" height="66" rx="6" fill="#E4F0EA" stroke="none"/><rect x="47" y="153" width="36" height="25" rx="2" fill="none" stroke="#126C65"/><path d="M52 160l5 5-5 5m11 0h11" fill="none" stroke="#126C65" stroke-width="2"/><text x="120" y="162" font-size="26" fill="#153446" font-weight="700" ><tspan x="120" dy="0">SAP geliştirme erişimi</tspan></text><text x="120" y="198" font-size="21" fill="#506875" font-weight="400" ><tspan x="120" dy="0">SE38’de program oluşturup çalıştırabilmelisiniz.</tspan><tspan x="120" dy="29">Bir geliştirme sistemi, paket ve kendi task’ınız gerekir.</tspan></text><path d="M120 253H768" stroke="#CBD8D8" stroke-width="2"/><rect x="32" y="283" width="66" height="66" rx="6" fill="#E4F0EA" stroke="none"/><circle cx="60" cy="311" r="14" fill="none" stroke="#126C65" stroke-width="2"/><circle cx="71" cy="322" r="14" fill="#E4F0EA" stroke="#126C65" stroke-width="2"/><text x="71" y="329" font-size="20" fill="#126C65" font-weight="600" text-anchor="middle"><tspan x="71" dy="0">₺</tspan></text><text x="120" y="309" font-size="26" fill="#153446" font-weight="700" ><tspan x="120" dy="0">Hangi kurları alacağınız</tspan></text><text x="120" y="345" font-size="21" fill="#506875" font-weight="400" ><tspan x="120" dy="0">Para birimlerini, alış/satış kurunu ve tarihi seçin.</tspan><tspan x="120" dy="29">SAP kur tipi ve OBBS dönüşüm oranlarını doğrulayın.</tspan></text><path d="M120 400H768" stroke="#CBD8D8" stroke-width="2"/><rect x="32" y="430" width="66" height="66" rx="6" fill="#E4F0EA" stroke="none"/><g fill="none" stroke="#126C65" stroke-width="2.5"><rect x="45" y="455" width="25" height="14" rx="7" transform="rotate(-35 57 462)"/><rect x="61" y="455" width="25" height="14" rx="7" transform="rotate(-35 73 462)"/></g><text x="120" y="456" font-size="26" fill="#153446" font-weight="700" ><tspan x="120" dy="0">SAP’den TCMB’ye bağlantı</tspan></text><text x="120" y="492" font-size="21" fill="#506875" font-weight="400" ><tspan x="120" dy="0">SAP uygulama sunucusu TCMB’ye HTTPS ile ulaşmalı.</tspan><tspan x="120" dy="29">Kendi bilgisayarınızdan erişebilmeniz yeterli değildir.</tspan></text><rect x="32" y="584" width="736" height="98" rx="4" fill="#153446" stroke="none"/><text x="52" y="619" font-size="22" fill="#FFFFFF" font-weight="600" ><tspan x="52" dy="0">Yetki sizdeyse kendiniz tamamlayabilirsiniz.</tspan></text><text x="52" y="651" font-size="21" fill="#D9E7E7" font-weight="400" ><tspan x="52" dy="0">Gerektiğinde FI veya Basis/ağ sorumlusuyla ilerleyin.</tspan></text><text x="32" y="724" font-size="20" fill="#126C65" font-weight="600" ><tspan x="32" dy="0">Normal HTTPS kullanımında sunucuya ek yazılım kurulmaz.</tspan></text></g></svg>
